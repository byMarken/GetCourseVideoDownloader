name: Bug report
description: Сообщить о воспроизводимой ошибке
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Не прикладывайте cookies, browser profile и ссылки на закрытые материалы.
  - type: input
    id: version
    attributes:
      label: Версия
      placeholder: v0.3.0
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Шаги воспроизведения
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Ожидаемый результат
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Фактический результат и безопасные логи
    validations:
      required: true
